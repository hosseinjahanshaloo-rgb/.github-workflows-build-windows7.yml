name: Build Windows 7 app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Python 3.8 is the last version that runs on Windows 7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kivy[base]==2.3.0" arabic-reshaper==3.0.0 python-bidi==0.4.2 six plyer pyinstaller==5.13.2

      - name: Build with PyInstaller
        shell: cmd
        run: pyinstaller --noconfirm --windowed --name EnglishAdventure --add-data "data;data" --add-data "audio;audio" --add-data "fonts;fonts" --add-data "sounds;sounds" main.py

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist\EnglishAdventure -DestinationPath EnglishAdventure-win7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishAdventure-win7
          path: EnglishAdventure-win7.zip
